spring.application.name=restaurant-service
server.port=8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=restaurant_service_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=food_user
spring.datasource.password=Food@123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=my-super-secret-key-for-food-ordering-system-must-be-long