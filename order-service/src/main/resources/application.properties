spring.application.name=order-service
server.port=8083

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=order_service_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=food_user
spring.datasource.password=Food@123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# Order Service Route
spring.cloud.gateway.server.webmvc.routes[2].id=order-service-route
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/order-service/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1