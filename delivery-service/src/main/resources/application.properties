spring.application.name=delivery-service
server.port=8086

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=delivery_service_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=food_user
spring.datasource.password=Food@12345

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect