spring.application.name=user-service
server.port=8081

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=user_service_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=food_user
spring.datasource.password=Food@12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
jwt.secret=my-super-secret-key-for-food-ordering-system-must-be-long
