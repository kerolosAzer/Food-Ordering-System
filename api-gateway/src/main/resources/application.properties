spring.application.name=api-gateway
server.port=${PORT:8085}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# User Service Route
spring.cloud.gateway.server.webmvc.routes[0].id=user-service-route
spring.cloud.gateway.server.webmvc.routes[0].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/user-service/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

# Restaurant Service Route
spring.cloud.gateway.server.webmvc.routes[1].id=restaurant-service-route
spring.cloud.gateway.server.webmvc.routes[1].uri=${RESTAURANT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/restaurant-service/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

# Order Service Route
spring.cloud.gateway.server.webmvc.routes[2].id=order-service-route
spring.cloud.gateway.server.webmvc.routes[2].uri=${ORDER_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/order-service/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

# Payment Service Route
spring.cloud.gateway.server.webmvc.routes[3].id=payment-service-route
spring.cloud.gateway.server.webmvc.routes[3].uri=${PAYMENT_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/payment-service/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1

# Delivery Service Route
spring.cloud.gateway.server.webmvc.routes[4].id=delivery-service-route
spring.cloud.gateway.server.webmvc.routes[4].uri=${DELIVERY_SERVICE_URL:http://localhost:8086}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/delivery-service/**
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=StripPrefix=1

# CORS Configuration
spring.web.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://localhost:3001}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
